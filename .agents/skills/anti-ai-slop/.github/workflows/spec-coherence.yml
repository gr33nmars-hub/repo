name: spec-coherence

on:
  pull_request:

jobs:
  coherence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/repo_inventory.py --root . --out specs/_meta/evidence/existing-code-scan.md
      - run: python tools/validators/check_all.py --root . --format markdown --out specs/_meta/coherence-latest.md
