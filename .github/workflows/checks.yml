name: checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Backend tests
        run: uv run --directory backend --group test pytest -q
      - name: Backend lint and format
        run: |
          uv run --directory backend --group quality ruff check casino tests run_api.py
          uv run --directory backend --group quality ruff format --check casino tests run_api.py
      - name: Backend types
        shell: bash
        run: |
          set +e
          output="$(uv run --directory backend --group quality mypy --show-error-codes --python-version 3.10 casino run_api.py 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              if [[ "$line" == *": error:"* ]]; then
                line="${line//'%'/'%25'}"
                line="${line//$'\r'/'%0D'}"
                line="${line//$'\n'/'%0A'}"
                printf '::error::%s\n' "$line"
              fi
            done <<< "$output"
          fi
          exit "$status"

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests, lint, and build
        working-directory: frontend
        run: |
          npm run test:unit
          npm run lint
          npm run build

  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build Tauri desktop app
        working-directory: frontend
        shell: bash
        run: |
          set +e
          output="$(npm run tauri:build 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              if [[ "$line" =~ (error|Error|failed|Failed) ]]; then
                line="${line//'%'/'%25'}"
                line="${line//$'\r'/'%0D'}"
                line="${line//$'\n'/'%0A'}"
                printf '::error::%s\n' "$line"
              fi
            done <<< "$output"
          fi
          exit "$status"
      - name: Smoke-test packaged API sidecar
        working-directory: frontend
        run: npm run smoke:sidecar
